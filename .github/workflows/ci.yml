
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: rootpass
  DB_NAME: afyacall

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: afyacall
        ports:
          - 3306:3306

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install MariaDB client
      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      # 3. Set up PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli, pdo_mysql
          coverage: none

      # 4. Verify PHP
      - name: Verify PHP version and extensions
        run: |
          php -v
          php -m | grep -Ei 'mysqli|pdo_mysql'

      # 5. Wait for MariaDB
      - name: Wait for MariaDB
        run: |
          set -e

          for i in $(seq 1 60); do
            if mysql \
              --connect-timeout=2 \
              -h "$DB_HOST" \
              -P "$DB_PORT" \
              -u "$DB_USER" \
              --password="$DB_PASSWORD" \
              -e "SELECT 1;" 2>/dev/null; then

              echo "MariaDB is ready!"
              exit 0
            fi

            echo "Waiting for MariaDB... ($i/60)"
            sleep 2
          done

          echo "MariaDB failed to become ready"
          exit 1

      # 6. Import database schema
      - name: Import database schema
        run: |
          set -e

          if [ ! -f database.sql ]; then
            echo "database.sql not found!"
            exit 1
          fi

          mysql \
            -h "$DB_HOST" \
            -P "$DB_PORT" \
            -u "$DB_USER" \
            --password="$DB_PASSWORD" \
            "$DB_NAME" < database.sql

          echo "Database imported successfully!"

          mysql \
            -h "$DB_HOST" \
            -P "$DB_PORT" \
            -u "$DB_USER" \
            --password="$DB_PASSWORD" \
            "$DB_NAME" \
            -e "SHOW TABLES;"

      # 7. PHP syntax validation
      - name: PHP syntax check
        run: |
          set -e

          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              echo "PHP syntax error: $file"
              exit 1
            fi
          done < <(
            find . -name '*.php' \
              -not -path './vendor/*' \
              -print0
          )

          echo "All PHP files pass syntax checks!"

      # 8. Start PHP server
      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8000 -t . \
            > /tmp/php_server.log 2>&1 &

          echo $! > /tmp/php_server.pid

          for i in $(seq 1 10); do
            if curl -s \
              http://127.0.0.1:8000/index.php \
              > /dev/null; then

              echo "PHP server is running!"
              exit 0
            fi

            sleep 1
          done

          echo "PHP server failed to start"
          cat /tmp/php_server.log
          exit 1

      # 9. Smoke tests
      - name: Smoke test endpoints
        run: |
          set -e

          check_endpoint() {
            name="$1"
            url="$2"
            expected="$3"

            echo "=== $name ==="

            code=$(curl -s -o "/tmp/response.html" \
              -w "%{http_code}" "$url")

            echo "HTTP $code"

            if [ "$code" != "$expected" ]; then
              echo "Expected HTTP $expected but received $code"
              echo "=== Response body ==="
              cat /tmp/response.html
              echo ""
              echo "=== PHP Server Logs ==="
              cat /tmp/php_server.log
              exit 1
            fi
          }

          check_endpoint "Landing page" \
            "http://127.0.0.1:8000/index.php" 200

          check_endpoint "Login page" \
            "http://127.0.0.1:8000/auth/login.php" 200

          check_endpoint "Dashboard authentication" \
            "http://127.0.0.1:8000/dashboard/index.php" 302

          echo "All smoke tests passed!"

      # 10. Logs on failure
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== PHP Server Logs ==="
          cat /tmp/php_server.log || true

          echo "=== MariaDB Container Logs ==="
          docker ps -a
